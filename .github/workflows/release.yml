name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Setup embedded Python runtime
        run: bash scripts/setup-python-runtime.sh
        shell: bash

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          VITE_CONSOLE_URL: ${{ secrets.VITE_CONSOLE_URL }}
          VITE_AUTH_BASE_URL: ${{ secrets.VITE_AUTH_BASE_URL }}
          VITE_ORDER_API_URL: ${{ secrets.VITE_ORDER_API_URL }}
          VITE_PROVIDERS_URL: ${{ secrets.VITE_PROVIDERS_URL }}
        shell: bash
        run: |
          # Write signing key to file. GitHub Secrets injection or shell expansion
          # can append trailing bytes (observed: extra %/\n at end). Use Python to
          # strip all non-base64 chars then truncate to a multiple of 4, which is
          # the only valid length for base64.
          #
          # Tauri 2 only reads TAURI_SIGNING_PRIVATE_KEY; it auto-detects file path vs content.
          python3 <<'PYEOF' > "$RUNNER_TEMP/tauri-signing-key.txt"
          import os, sys, re
          raw = os.environ.get('RAW_KEY', '')
          cleaned = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
          valid_len = (len(cleaned) // 4) * 4
          sys.stdout.write(cleaned[:valid_len])
          PYEOF
          echo "Key file size: $(wc -c < "$RUNNER_TEMP/tauri-signing-key.txt") bytes"
          echo "Last 16 bytes (hex):"
          tail -c 16 "$RUNNER_TEMP/tauri-signing-key.txt" | od -c | head -2
          export TAURI_SIGNING_PRIVATE_KEY="$RUNNER_TEMP/tauri-signing-key.txt"

          # Update version in tauri.conf.json to match the git tag
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          python3 -c "
          import json
          with open('src-tauri/tauri.conf.json', 'r') as f:
              cfg = json.load(f)
          cfg['version'] = '$VERSION'
          with open('src-tauri/tauri.conf.json', 'w') as f:
              json.dump(cfg, f, indent=2)
              f.write('\n')
          print(f'Updated tauri.conf.json version to $VERSION')
          "

          npx tauri build --target ${{ matrix.target }}
          rm -f "$RUNNER_TEMP/tauri-signing-key.txt"

      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Abu ${{ github.ref_name }}" \
            --notes "See the assets below for download links." \
            || true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          TARGET="${{ matrix.target }}"
          BUNDLE="src-tauri/target/${TARGET}/release/bundle"

          echo "=== Bundle contents ==="
          ls -la "$BUNDLE"/macos/ 2>/dev/null || true
          ls -la "$BUNDLE"/dmg/ 2>/dev/null || true
          ls -la "$BUNDLE"/nsis/ 2>/dev/null || true

          if [[ "$TARGET" == *"apple"* ]]; then
            # macOS .app.tar.gz has the same filename across architectures —
            # rename to include arch suffix to avoid Release upload collision.
            if [[ "$TARGET" == *"aarch64"* ]]; then
              ARCH_SUFFIX="aarch64"
            else
              ARCH_SUFFIX="x64"
            fi

            gh release upload "$TAG" "$BUNDLE"/dmg/*.dmg --clobber || true

            # Updater artifacts (.app.tar.gz) are only generated when createUpdaterArtifacts=true
            if [ -f "$BUNDLE"/macos/Abu.app.tar.gz ]; then
              cp "$BUNDLE"/macos/Abu.app.tar.gz "$BUNDLE"/macos/Abu_${ARCH_SUFFIX}.app.tar.gz
              cp "$BUNDLE"/macos/Abu.app.tar.gz.sig "$BUNDLE"/macos/Abu_${ARCH_SUFFIX}.app.tar.gz.sig
              gh release upload "$TAG" "$BUNDLE"/macos/Abu_${ARCH_SUFFIX}.app.tar.gz --clobber
              gh release upload "$TAG" "$BUNDLE"/macos/Abu_${ARCH_SUFFIX}.app.tar.gz.sig --clobber
            else
              echo "No updater artifacts found (createUpdaterArtifacts=false), skipping .app.tar.gz upload"
            fi
          else
            # Tauri 2 signs the NSIS .exe installer directly (not a separate .nsis.zip).
            # The .exe is both the installer and the updater bundle.
            # Rename .exe to stable name (without version) for latest.json
            cp "$BUNDLE"/nsis/*-setup.exe "$BUNDLE"/nsis/Abu_x64-setup.exe
            gh release upload "$TAG" "$BUNDLE"/nsis/Abu_x64-setup.exe --clobber
            if ls "$BUNDLE"/nsis/*-setup.exe.sig 1>/dev/null 2>&1; then
              # Rename .sig to stable name for latest.json generation
              cp "$BUNDLE"/nsis/*-setup.exe.sig "$BUNDLE"/nsis/Abu_x64-setup.exe.sig
              gh release upload "$TAG" "$BUNDLE"/nsis/Abu_x64-setup.exe.sig --clobber
            else
              echo "No updater signature found (createUpdaterArtifacts=false), skipping .sig upload"
            fi
          fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Generate latest.json and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          export TAG="${{ github.ref_name }}"
          export REPO="${{ github.repository }}"

          # Download .sig files from release assets
          mkdir -p /tmp/sigs
          gh release download "$TAG" --repo "$REPO" --pattern "*.sig" --dir /tmp/sigs --clobber || true

          # Read signatures
          export SIG_AARCH64=$(cat /tmp/sigs/Abu_aarch64.app.tar.gz.sig 2>/dev/null || echo "")
          export SIG_X64=$(cat /tmp/sigs/Abu_x64.app.tar.gz.sig 2>/dev/null || echo "")
          export SIG_WINDOWS=$(cat /tmp/sigs/Abu_x64-setup.exe.sig 2>/dev/null || echo "")

          export BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          export RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"

          # Generate latest.json
          python3 <<'PYEOF'
          import json, os, sys

          tag = os.environ['TAG']
          base = os.environ['BASE_URL']
          release_url = os.environ['RELEASE_URL']

          sig_aarch64 = os.environ.get('SIG_AARCH64', '').strip()
          sig_x64 = os.environ.get('SIG_X64', '').strip()
          sig_win = os.environ.get('SIG_WINDOWS', '').strip()

          if not any([sig_aarch64, sig_x64, sig_win]):
              print("ERROR: No .sig files found, cannot generate latest.json", file=sys.stderr)
              sys.exit(1)

          from datetime import datetime, timezone
          pub_date = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

          platforms = {}
          if sig_aarch64:
              platforms['darwin-aarch64'] = {
                  'signature': sig_aarch64,
                  'url': f'{base}/Abu_aarch64.app.tar.gz',
              }
          if sig_x64:
              platforms['darwin-x86_64'] = {
                  'signature': sig_x64,
                  'url': f'{base}/Abu_x64.app.tar.gz',
              }
          if sig_win:
              platforms['windows-x86_64'] = {
                  'signature': sig_win,
                  'url': f'{base}/Abu_x64-setup.exe',
              }

          latest = {
              'version': tag.lstrip('v'),
              'notes': f'See {release_url} for details.',
              'pub_date': pub_date,
              'platforms': platforms,
          }

          with open('/tmp/latest.json', 'w') as f:
              json.dump(latest, f, indent=2)
          print(json.dumps(latest, indent=2))
          PYEOF

          gh release upload "$TAG" /tmp/latest.json --repo "$REPO" --clobber
